  <style>
    :root {
      --accent: #FF0004;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    body {
      overscroll-behavior: none;
      touch-action: none;
    }

    .frame-hit {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: transparent;
      font: inherit;
      box-shadow: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    /* One iframe per screen */

    .frames {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
    }

    .frame {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 0;
      overflow: hidden;
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="frames" data-frames aria-hidden="true"></main>

  <h1 class="visually-hidden">Лепай — графический дизайнер</h1>
