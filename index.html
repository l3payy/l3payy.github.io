  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "lepay-accent-hue";
      var MIN_DISTANCE = 110;
      var lastHue = null;

      try {
        var stored = window.localStorage.getItem(STORAGE_KEY);
        if (stored !== null && isFinite(Number(stored))) {
          lastHue = ((Number(stored) % 360) + 360) % 360;
        }
      } catch (error) {
        /* Storage can be unavailable. */
      }

      function distance(a, b) {
        var diff = Math.abs(a - b) % 360;
        return Math.min(diff, 360 - diff);
      }

      var hue = Math.floor(Math.random() * 360);

      if (lastHue !== null) {
        var attempts = 0;
        while (distance(hue, lastHue) < MIN_DISTANCE && attempts < 30) {
          hue = Math.floor(Math.random() * 360);
          attempts += 1;
        }
        if (distance(hue, lastHue) < MIN_DISTANCE) {
          hue = (lastHue + 180) % 360;
        }
      }

      try {
        window.localStorage.setItem(STORAGE_KEY, String(hue));
      } catch (error) {
        /* Storage can be unavailable. */
      }

      document.documentElement.style.setProperty("--accent", "hsl(" + hue + " 100% 50%)");
      document.documentElement.dataset.hue = String(hue);
    })();
  </script>

  <style>
    :root {
      --accent: hsl(0 100% 50%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    body {
      overscroll-behavior: none;
      touch-action: none;
    }

    .focus-hit {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 0;
      background: transparent;
      cursor: pointer;
    }

    /* Background: video → #090909 10% → accent 10% */

    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #090909;
    }

    .stage__video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(1);
    }

    .stage__shade,
    .stage__accent {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stage__shade {
      background: #090909;
      opacity: 0.1;
    }

    .stage__accent {
      background: var(--accent);
      opacity: 0.16;
    }

    /* One iframe per screen */

    .frames {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
    }

    .frame {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 0;
      overflow: hidden;
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    (function () {
      "use strict";

      var frames = Array.prototype.slice.call(document.querySelectorAll("[data-frame]"));
      if (frames.length < 2) return;

      var focusHit = document.querySelector("[data-focus-hit]");
      var max = frames.length - 1;
      var current = 0;
      var target = 0;
      var running = false;
      var snapTimer = 0;
      var touchY = null;
      var wheelAccum = 0;
      var wheelLocked = false;

      function clamp(value, min, maxValue) {
        return Math.min(maxValue, Math.max(min, value));
      }

      function applySizes(progress) {
        var viewport = window.innerHeight;
        var base = Math.floor(progress);
        var fraction = progress - base;

        frames.forEach(function (frame, index) {
          var height = 0;

          if (index === base) {
            height = viewport * (1 - fraction);
          } else if (index === base + 1) {
            height = viewport * fraction;
          }

          frame.style.height = height + "px";

          var iframe = frame.querySelector("iframe");
          if (iframe && iframe.contentDocument) {
            var badge = iframe.contentDocument.querySelector(".badge");
            if (badge) {
              badge.style.setProperty(
                "--badge-scale",
                String(viewport > 0 ? height / viewport : 0)
              );
            }
          }
        });

        if (focusHit) {
          var focusHeight = frames[0] ? frames[0].getBoundingClientRect().height : 0;
          focusHit.style.height = focusHeight + "px";
          focusHit.style.pointerEvents = focusHeight > 0 ? "auto" : "none";
        }
      }

      function tick() {
        var difference = target - current;

        if (Math.abs(difference) < 0.0008) {
          current = target;
          applySizes(current);
          running = false;
          return;
        }

        current += difference * 0.24;
        applySizes(current);
        window.requestAnimationFrame(tick);
      }

      function start() {
        if (running) return;
        running = true;
        window.requestAnimationFrame(tick);
      }

      function scheduleSnap() {
        window.clearTimeout(snapTimer);
        snapTimer = window.setTimeout(function () {
          target = clamp(Math.round(target), 0, max);
          start();
        }, 160);
      }

      function onWheel(event) {
        if (event.ctrlKey) return;

        event.preventDefault();

        var delta = event.deltaY;
        if (event.deltaMode === 1) delta *= 16;
        else if (event.deltaMode === 2) delta *= window.innerHeight;

        if (Math.abs(delta) < 1) return;

        wheelAccum += delta;
        if (Math.abs(wheelAccum) < 30) return;

        var direction = wheelAccum > 0 ? 1 : -1;
        wheelAccum = 0;

        if (wheelLocked) return;

        wheelLocked = true;
        window.setTimeout(function () {
          wheelLocked = false;
        }, 320);

        target = clamp(Math.round(target) + direction, 0, max);
        start();
      }

      function onKeydown(event) {
        if (event.key === "ArrowDown" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          target = clamp(Math.ceil(target + 0.001), 0, max);
          start();
        } else if (event.key === "ArrowUp" || event.key === "PageUp") {
          event.preventDefault();
          target = clamp(Math.floor(target - 0.001), 0, max);
          start();
        }
      }

      function onTouchStart(event) {
        touchY = event.touches[0].clientY;
      }

      function onTouchMove(event) {
        if (touchY === null) return;

        event.preventDefault();

        var nextY = event.touches[0].clientY;
        var viewport = window.innerHeight || 1;
        target = clamp(target + (touchY - nextY) / (viewport * 0.5), 0, max);
        touchY = nextY;

        scheduleSnap();
        start();
      }

      function onTouchEnd() {
        touchY = null;
        scheduleSnap();
      }

      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("keydown", onKeydown);
      window.addEventListener("touchstart", onTouchStart, { passive: true });
      window.addEventListener("touchmove", onTouchMove, { passive: false });
      window.addEventListener("touchend", onTouchEnd, { passive: true });

      window.addEventListener("resize", function () {
        applySizes(current);
      });

      frames.forEach(function (frame) {
        var iframe = frame.querySelector("iframe");
        if (iframe) {
          iframe.addEventListener("load", function () {
            applySizes(current);
          });
        }
      });

      var video = document.querySelector(".stage__video");
      if (video && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        video.pause();
      }

      applySizes(0);
    })();
  </script>
