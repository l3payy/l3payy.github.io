<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Frame</title>
  <style>
    :root {
      --word-max-width: 800px;
      --video-max-width: 1340px;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .video-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }

    .video-bg video {
      display: block;
      width: 100%;
      max-width: var(--video-max-width, 1340px);
      height: 100%;
      object-fit: fill;
      filter: grayscale(1);
      background: #090909;
    }

    .word {
      position: absolute;
      top: -20px;
      bottom: -20px;
      left: 50%;
      z-index: 1;
      width: calc(100% + 20px);
      max-width: var(--word-max-width, 800px);
      height: auto;
      transform: translateX(-50%);
      background-color: var(--accent, #FF0004);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      -webkit-mask-image: var(--src);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: 100% 100%;
      mask-image: var(--src);
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: 100% 100%;
      mask-mode: alpha;
    }

    .word.is-ready {
      opacity: 1;
    }

    .badge {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(var(--badge-max-width, 845px), 86vw);
      height: auto;
      aspect-ratio: var(--badge-ratio, 845 / 131);
      line-height: 0;
      transform: translate(-50%, -50%) scaleY(var(--badge-scale, 1));
      transform-origin: center;
      pointer-events: none;
      user-select: none;
    }

    .badge-outline-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .badge-outline {
      position: absolute;
      inset: 0;
      background: var(--accent, #FF0004);
      -webkit-mask-image: var(--outline-src);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: 100% 100%;
      mask-image: var(--outline-src);
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: 100% 100%;
      mask-mode: alpha;
    }

    .badge-white-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }

    .badge img {
      display: block;
      width: var(--badge-white-width, 100%);
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="video-bg" id="video-bg">
    <video id="frame-video" muted loop playsinline preload="none"></video>
  </div>

  <div class="word" id="word" role="img"></div>

  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var root = document.documentElement;
      var word = document.getElementById("word");

      var primary = params.get("primary") || params.get("svg") || "Focus.svg";
      var label = params.get("label") || "Проект";
      var videoSrc = params.get("video");
      var posterSrc = params.get("poster");
      var badge = params.get("badge");
      var badgeWidth = parseFloat(params.get("badgeW"));
      var badgeHeight = parseFloat(params.get("badgeH"));
      var outline = params.get("outline");
      var outlineWidth = parseFloat(params.get("outlineW"));
      var outlineHeight = parseFloat(params.get("outlineH"));

      var accent = "#FF0004";
      try {
        var parentAccent = window
          .getComputedStyle(window.parent.document.documentElement)
          .getPropertyValue("--accent")
          .trim();
        if (parentAccent) accent = parentAccent;
      } catch (error) {
        /* Opened outside the parent page. */
      }

      root.style.setProperty("--accent", accent);
      word.setAttribute("aria-label", label);
      document.title = label;

      var videoBg = document.getElementById("video-bg");
      var frameVideo = document.getElementById("frame-video");
      var videoLoaded = false;

      if (videoSrc && frameVideo) {
        frameVideo.muted = true;
        frameVideo.src = videoSrc;
        if (posterSrc) frameVideo.poster = posterSrc;
      } else if (videoBg) {
        videoBg.remove();
      }

      window.frameVideoApi = {
        load: function () {
          if (!videoSrc || !frameVideo || videoLoaded) return;
          videoLoaded = true;
          frameVideo.preload = "auto";
          frameVideo.load();
        },
        play: function () {
          if (!videoSrc || !frameVideo) return;
          videoLoaded = true;
          frameVideo.preload = "auto";
          var promise = frameVideo.play();
          if (promise && promise.catch) promise.catch(function () {});
        },
        pause: function () {
          if (frameVideo) frameVideo.pause();
        }
      };

      if (badge || outline) {
        var badgeWrap = document.createElement("span");
        badgeWrap.className = "badge";

        var naturalWidth = outlineWidth > 0 ? outlineWidth : badgeWidth;
        var naturalHeight = outlineHeight > 0 ? outlineHeight : badgeHeight;
        if (naturalWidth > 0 && naturalHeight > 0) {
          badgeWrap.style.setProperty("--badge-max-width", naturalWidth + "px");
          badgeWrap.style.setProperty("--badge-ratio", naturalWidth + " / " + naturalHeight);
        }
        if (outline && outlineWidth > 0 && badgeWidth > 0) {
          badgeWrap.style.setProperty(
            "--badge-white-width",
            (badgeWidth / outlineWidth) * 100 + "%"
          );
        }

        if (outline) {
          var outlineWrap = document.createElement("span");
          outlineWrap.className = "badge-outline-wrap";

          var outlineLayer = document.createElement("span");
          outlineLayer.className = "badge-outline";
          outlineLayer.style.setProperty(
            "--outline-src",
            'url("' + outline.replace(/["\\]/g, "") + '")'
          );
          outlineWrap.appendChild(outlineLayer);
          badgeWrap.appendChild(outlineWrap);
        }

        if (badge) {
          var whiteWrap = document.createElement("span");
          whiteWrap.className = "badge-white-wrap";

          var badgeImage = document.createElement("img");
          badgeImage.src = badge.replace(/["\\]/g, "");
          badgeImage.alt = "";
          badgeImage.setAttribute("aria-hidden", "true");
          whiteWrap.appendChild(badgeImage);
          badgeWrap.appendChild(whiteWrap);
        }

        document.body.appendChild(badgeWrap);
      }

      function reveal() {
        word.classList.add("is-ready");
      }

      root.style.setProperty("--src", 'url("' + primary.replace(/["\\]/g, "") + '")');

      var probe = new Image();
      probe.onload = reveal;
      probe.onerror = reveal;
      probe.src = primary;
    })();
  </script>
</body>
</html>
