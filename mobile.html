<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лепай</title>
  <meta name="description" content="Я — Лепай (lepayy, l3payy). Проекты, плагины, ссылки и весёлые картинки.">
  <meta name="keywords" content="Лепай, lepayy, l3payy, msvxdlss, портфолио, дизайн, плагины">
  <link rel="icon" href="icon/icon.png" type="image/png">
  <script>
    if (window.matchMedia('(min-width: 769px)').matches) {
      location.replace('index.html');
    }
  </script>
  <script src="accent.js"></script>
  <style>
    :root { --accent: #FFFFFF; }
    html, body { margin: 0; background: #000; color: var(--accent); font-family: sans-serif; }
  </style>
</head>
<body>

  <header style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">
    <h1>Лепай (lepayy, l3payy) — дизайн, плагины и проекты</h1>
  </header>

  <!-- Моб-дизайн будет отдельно. Общие данные уже подключены: -->
  <div id="track-title"></div>
  <div id="track-artist"></div>

  <script src="track.js"></script>
  <script>
    if (window.TRACK_INFO) {
      document.getElementById('track-title').textContent = window.TRACK_INFO.title;
      document.getElementById('track-artist').textContent = window.TRACK_INFO.artist;
    }
  </script>

</body>
</html>
