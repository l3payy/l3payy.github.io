  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "lepay-accent-hue";
      var MIN_DISTANCE = 110;
      var lastHue = null;

      try {
        var stored = window.localStorage.getItem(STORAGE_KEY);
        if (stored !== null && isFinite(Number(stored))) {
          lastHue = ((Number(stored) % 360) + 360) % 360;
        }
      } catch (error) {
        /* Storage can be unavailable. */
      }

      function distance(a, b) {
        var diff = Math.abs(a - b) % 360;
        return Math.min(diff, 360 - diff);
      }

      var hue = Math.floor(Math.random() * 360);

      if (lastHue !== null) {
        var attempts = 0;
        while (distance(hue, lastHue) < MIN_DISTANCE && attempts < 30) {
          hue = Math.floor(Math.random() * 360);
          attempts += 1;
        }
        if (distance(hue, lastHue) < MIN_DISTANCE) {
          hue = (lastHue + 180) % 360;
        }
      }

      try {
        window.localStorage.setItem(STORAGE_KEY, String(hue));
      } catch (error) {
        /* Storage can be unavailable. */
      }

      document.documentElement.style.setProperty("--accent", "hsl(" + hue + " 100% 50%)");
      document.documentElement.dataset.hue = String(hue);
    })();
  </script>

  <style>
    :root {
      --accent: hsl(0 100% 50%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    body {
      overscroll-behavior: none;
      touch-action: none;
    }

    .frame-hit {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: transparent;
      font: inherit;
      box-shadow: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    /* Background: video → accent 16% */

    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #090909;
    }

    .stage__video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .stage__accent {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--accent);
      opacity: 0.16;
    }

    /* One iframe per screen */

    .frames {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
    }

    .frame {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 0;
      overflow: hidden;
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <video class="stage__video" autoplay muted loop playsinline preload="auto" poster="assets/media/bg-poster.jpg?v=ad68113281">
      <source src="assets/media/bg.mp4?v=fac92b5e44" type="video/mp4">
    </video>
    <div class="stage__accent"></div>
  </div>

  <main class="frames" data-frames aria-hidden="true"></main>

  <h1 class="visually-hidden">Лепай — графический дизайнер</h1>
  <p class="visually-hidden" data-word-list></p>

</body>
