  <style>
    .rotate-hint { display: none; }
    @media (orientation: portrait) {
      body > *:not(.rotate-hint) { display: none !important; }
      .rotate-hint {
        display: flex !important;
        position: fixed;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        overflow: hidden;
        padding: 24px;
      }
      .rotate-hint::before {
        content: '';
        position: absolute;
        inset: -24px;
        background: url('poster.png') center / cover no-repeat;
        filter: blur(20px);
      }
      .rotate-hint::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(var(--accent-rgb), 0.1);
      }
      .rotate-icon {
        position: relative;
        z-index: 1;
        width: min(326px, 80vw);
        aspect-ratio: 326 / 255;
        filter: drop-shadow(0px 0px 10px var(--accent));
      }
      .rotate-icon::before {
        content: '';
        position: absolute;
        inset: 0;
        background-color: var(--accent);
        -webkit-mask-image: url('rotate.svg');
        -webkit-mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-image: url('rotate.svg');
        mask-size: contain;
        mask-repeat: no-repeat;
        mask-position: center;
      }
    }
    @media (orientation: landscape) and (max-height: 500px) {

  <script src="track.js"></script>
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    const worksPage = document.getElementById('worksPage');
    function openWorks() {
      if (audio && !audio.paused) {
        clearInterval(fadeTimer);
        audio.pause();
        setIcon('play');
        widget.classList.remove('is-playing');
      }
      document.body.classList.add('works-open');
      worksPage.setAttribute('aria-hidden', 'false');
    }
    function closeWorks() {
      document.body.classList.remove('works-open');
      worksPage.setAttribute('aria-hidden', 'true');
    }
    document.querySelector('.work-logo').addEventListener('click', openWorks);
    document.getElementById('worksBackLeft').addEventListener('click', closeWorks);
    document.getElementById('worksBackRight').addEventListener('click', closeWorks);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeWorks();
    });
    if (window.TRACK_INFO && document.getElementById('track-title')) {
      document.getElementById('track-title').textContent = window.TRACK_INFO.title;
      document.getElementById('track-artist').textContent = window.TRACK_INFO.artist;
    }
    const audio = document.getElementById('music-audio');
    if (audio) {
    const TARGET_VOLUME = 0.05;
    const FADE_IN_MS = 2000;
    audio.volume = 0;
    let fadeTimer = null;
    const btn = document.querySelector('.music-btn');
    const widget = document.querySelector('.music-widget');
    const icon = document.querySelector('.music-icon');
    const cur = document.getElementById('track-cur');
    const dur = document.getElementById('track-dur');
    const bar = document.getElementById('track-bar');
    const fill = document.getElementById('track-fill');
    function fmt(t) {
      if (!isFinite(t)) return '0:00';
      t = Math.floor(t);
      return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    }
    function setIcon(name) {
      icon.style.webkitMaskImage = "url('mus/" + name + ".svg')";
      icon.style.maskImage = "url('mus/" + name + ".svg')";
    }
    function fadeIn() {
      clearInterval(fadeTimer);
      const step = TARGET_VOLUME / (FADE_IN_MS / 50);
      fadeTimer = setInterval(() => {
        if (audio.volume + step >= TARGET_VOLUME) {
          audio.volume = TARGET_VOLUME;
          clearInterval(fadeTimer);
        } else {
          audio.volume += step;
        }
      }, 50);
    }
    function startPlayback() {
      audio.volume = 0;
      let p;
      try { p = audio.play(); } catch (e) { return; }
      if (p && p.then) {
        p.then(() => {
          setIcon('pause');
          widget.classList.add('is-playing');
          fadeIn();
        }).catch(() => {});
      } else {
        setIcon('pause');
        widget.classList.add('is-playing');
        fadeIn();
      }
    }
    btn.addEventListener('click', () => {
      clearInterval(fadeTimer);
      if (audio.paused) {
        startPlayback();
      } else {
        audio.pause();
        setIcon('play');
        widget.classList.remove('is-playing');
      }
    });
    audio.addEventListener('loadedmetadata', () => {
      dur.textContent = fmt(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      cur.textContent = fmt(audio.currentTime);
      if (audio.duration) {
        fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });
    bar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const r = bar.getBoundingClientRect();
      audio.currentTime = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * audio.duration;
    });
    audio.addEventListener('ended', () => {
      setIcon('play');
      widget.classList.remove('is-playing');
    });
    }
  </script>
